        /* CSS RESET & VARIABILI BRANDING "FxV" */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        
        :root {
            --primary-color: #0F172A;   /* Blu Notte Ardesia Profondo (Autorevolezza e Lusso) */
            --secondary-color: #0D9488; /* Teal / Verde Petrolio (Wellness, Salute, Vitalità) */
            --accent-color: #F97316;    /* Arancione Energetico (Performance, Azione, CTA) */
            --bg-warm: #F8FAFC;          /* Grigio Ghiaccio Caldo e Pulito */
            --text-dark: #1E293B;       /* Antracite per testi ad alto contrasto */
            --text-light: #FFFFFF;
            --font-title: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-warm);
            color: var(--text-dark);
            line-height: 1.6;
            font-size: 18px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        section {
            padding: 100px 0;
        }

        /* HEADER */
        header {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: var(--font-title);
            font-size: 32px;
            font-weight: 800;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: -1px;
        }
        .logo span {
            color: var(--accent-color);
        }
        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
            font-size: 16px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--accent-color);
        }

        .hero {
            position: relative;
            height: 90vh;
            min-height: 600px;

            display: flex;
            align-items: center;
            color: var(--text-light);
            text-align: center;
        }

            max-width: 850px;
            margin: 0 auto;
        }

            font-size: 84px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 10px;
            letter-spacing: -3px;
